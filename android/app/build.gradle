apply plugin: 'com.android.application'

// Release signing uses ONLY Codemagic CM_* env vars from android_signing: rewardhub_key.
// NEVER load key.properties, NEVER fall back to a repo-local .jks / .keystore.
def cmKeystorePath = System.getenv("CM_KEYSTORE_PATH")
def hasCmSigning = cmKeystorePath != null && !cmKeystorePath.trim().isEmpty()

android {
    namespace "com.rewardhub.official.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.rewardhub.official.app"
        // Play Automatic Protection requires minSdk 24+
        minSdkVersion 24
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 22
        versionName "14.0.3"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    [
            rootProject.file('key.properties'),
            rootProject.file('app/key.properties'),
            file('key.properties'),
    ].findAll { it.exists() }.each { props ->
        logger.lifecycle("IGNORING ${props.absolutePath} — release signing uses CM_KEYSTORE_PATH only")
    }

    signingConfigs {
        release {
            // Populate only when CM_* is present so local assembleDebug can configure.
            // Release tasks still fail hard below if CM_KEYSTORE_PATH is missing.
            if (hasCmSigning) {
                storeFile file(System.getenv("CM_KEYSTORE_PATH"))
                storePassword System.getenv("CM_KEYSTORE_PASSWORD")
                keyAlias System.getenv("CM_KEY_ALIAS")
                keyPassword System.getenv("CM_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // Always attach release signing config — never leave release unsigned / debug-signed
            signingConfig signingConfigs.release
        }
    }
}

// Fail only when a release assemble/bundle is requested (keep debug/test usable locally)
gradle.taskGraph.whenReady { graph ->
    def releaseTasks = graph.allTasks.findAll { task ->
        def n = task.name.toLowerCase()
        (n.startsWith('assemble') || n.startsWith('bundle') || n.contains('bundle')) &&
                n.contains('release')
    }
    if (!releaseTasks.isEmpty() && !hasCmSigning) {
        throw new GradleException("CM_KEYSTORE_PATH is missing!")
    }
}

repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch (Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

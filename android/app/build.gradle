apply plugin: 'com.android.application'
apply plugin: 'com.google.gms.google-services'

android {
    namespace "com.rewardhub.official.app"
    compileSdkVersion rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.rewardhub.official.app"
        // Play Automatic Protection requires minSdk 24+
        minSdkVersion 24
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 18
        versionName "14.0.3"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    // Release signing uses Codemagic android_signing (rewardhub_key) only.
    // No fallback to any repo-local .jks. Configure only when CM_* is present so
    // local assembleDebug still works without Codemagic credentials.
    def cmKeystorePath = System.getenv("CM_KEYSTORE_PATH")
    def hasCmSigning = cmKeystorePath != null && !cmKeystorePath.trim().isEmpty()

    signingConfigs {
        release {
            if (hasCmSigning) {
                storeFile file(cmKeystorePath)
                storePassword System.getenv("CM_KEYSTORE_PASSWORD")
                keyAlias System.getenv("CM_KEY_ALIAS")
                keyPassword System.getenv("CM_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasCmSigning) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            applicationIdSuffix ""
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

repositories {
    flatDir {
        dirs 'libs'
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-ktx:$androidxCoreKTXVersion"
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidTestJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidEspressoCoreVersion"
}
